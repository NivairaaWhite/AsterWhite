# AsterWhite :: configs/base.yaml
#
# Production-scale defaults (mirrors AsterWhiteConfig()'s Python defaults
# exactly). Every other profile in this directory sets `extends:` to
# another profile (defaulting to this one) and overrides only what
# differs -- see asterwhite/profiles.py for the merge logic.
#
# `device` and `notes` are deployment metadata, not part of
# AsterWhiteConfig itself -- profiles.load_profile() strips them before
# constructing/validating the config; profiles.load_profile_raw() returns
# them if a caller wants to inspect them.

device: auto

name: AsterWhite

backbone:
  vocab_size: 32000
  d_model: 1024
  n_layers: 24
  n_heads: 16
  n_kv_heads: 4
  d_ff: 4096
  max_seq_len: 8192
  dropout: 0.0
  rope_theta: 10000.0
  norm_eps: 1.0e-5
  layer_pattern: "ASSA"
  ssm_state_dim: 16
  ssm_conv_kernel: 4
  tie_word_embeddings: true

narrative:
  world_state_dim: 512
  character_dim: 256
  plan_dim: 512
  working_memory_slots: 64
  episodic_memory_capacity: 100000
  max_plan_beats: 64
  revision_passes: 3

training:
  batch_size: 8
  micro_batch_size: 1
  learning_rate: 3.0e-4
  weight_decay: 0.1
  warmup_steps: 2000
  max_steps: 100000
  grad_clip: 1.0
  amp_dtype: bf16
  checkpoint_every: 1000
  checkpoint_dir: ./checkpoints
  log_every: 20
  distributed_strategy: ddp
  activation_checkpointing: false
  eval_every: 500
  grad_norm_clip_report_every: 20

grpo:
  group_size: 8
  kl_coef: 0.02
  clip_eps: 0.2
  learning_rate: 1.0e-5
  max_new_tokens: 512
  temperature: 1.0

inference:
  max_total_tokens: 4096
  default_max_new_tokens: 256
  default_temperature: 0.9
  default_top_p: 0.9
  default_top_k: 0
  default_repetition_penalty: 1.0
  quantize: false
  max_concurrent_requests: 8
  request_timeout_seconds: 60.0

notes: >
  Base profile. Not itself one of the 12 required hardware-tier profiles --
  it exists so those 12 only need to state what they override.
