# Same model/sharding shape as multi_gpu_fsdp, launched across multiple
# machines:
#
#   torchrun --nnodes=<N> --nproc_per_node=<M> --rdzv_backend=c10d \
#            --rdzv_endpoint=<host:port> train.py pretrain --profile multi_node --data ...
#
# Elastic restart (nodes joining/leaving mid-run) is NOT implemented --
# setup_distributed() assumes a fixed world size for the life of the run.
# A node failure currently means: fix/replace the node, relaunch all
# ranks together, and resume from the last checkpoint via --resume.
extends: multi_gpu_fsdp
device: cuda

backbone:
  moe:
    enabled: true
    num_experts: 16          # more devices across nodes -> more room to shard a larger total expert count
    num_experts_per_tok: 2
    num_shared_experts: 1
    aux_loss_coef: 0.01
    every_n_layers: 2

training:
  checkpoint_dir: ./checkpoints/multi_node

notes: >
  See README.md's scope notes for what "resumable after failure" does and
  doesn't cover here -- process/single-node resume is real; elastic
  multi-node membership changes are a documented gap, not implemented.
